[package]
name = "ncnc"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4.0"
actix-files = "0.6.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
reqwest = { version = "0.11.22", features = ["json", "socks", "stream"] }
once_cell = "1.19.0"
tokio = { version = "1.35", features = ["sync", "fs", "macros", "rt-multi-thread", "process", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
regex = "1.10"
rayon = "1.10"
chrono = "0.4"
chrono-tz = "0.10"
walkdir = "2"
urlencoding = "2"
actix-multipart = "0.6.1"
futures-util = "0.3.30"
sysinfo = "0.29"
jsonwebtoken = "9.2"
bcrypt = "0.15"
rand = "0.8"
base64 = "0.21"
quick-xml = "0.36"
dashmap = "6"
log = "0.4"
env_logger = "0.10"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
